name: whisper_finance_tracker
description: AI-powered expense tracking app with Firebase backend
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4

  # AI & Data Processing
  google_generative_ai: ^0.4.4
  image_picker: ^1.1.2
  camera: ^0.11.0+1
  image: ^4.3.0
  record: ^6.1.2
  permission_handler: ^12.0.1
  path_provider: ^2.1.4

  # UI/UX
  fl_chart: ^1.1.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  table_calendar: ^3.1.2
  flutter_datetime_picker_plus: ^2.1.0

  # Utilities
  uuid: ^4.5.1
  connectivity_plus: ^7.0.0
  shared_preferences: ^2.3.2
  dio: ^5.7.0
  logger: ^2.4.0

  # Export
  excel: ^4.0.4
  pdf: ^3.11.1
  share_plus: ^12.0.1

  # Widgets & Notifications
  home_widget: ^0.8.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
  #   - assets/icons/
